{% extends "base.html" %}

{% block title %}{{ t('notify_unsub_title') }} · {{ t('app_name') }}{% endblock %}

{% block content %}
<div style="max-width:560px;margin:60px auto;padding:0 20px;line-height:1.65">
  <h1 style="font-size:1.4rem;margin:0 0 10px">{{ t('notify_unsub_title') }}</h1>
  <p style="color:#4b5563">{{ t('notify_unsub_text') }}</p>
  <p style="margin-top:22px">
    <a href="{{ url_for('index') }}"
       style="display:inline-block;background:#1f3a63;color:#fff;text-decoration:none;
              padding:10px 20px;border-radius:8px">{{ t('app_name') }}</a>
  </p>
</div>
{% endblock %}
