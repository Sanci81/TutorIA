{% extends "base.html" %}

{% block title %}{{ t('forgot_password_title') }} · {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <h1 class="card-title">{{ t('forgot_password_title') }}</h1>
        <p class="card-subtitle">{{ t('forgot_password_subtitle') }}</p>

        <form method="post" action="{{ url_for('forgot_password') }}" novalidate>
            <div class="field">
                <label for="email">{{ t('label_email') }}</label>
                <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-block">{{ t('btn_send_reset_link') }}</button>
        </form>

        <p class="auth-alt">
            <a href="{{ url_for('login') }}">{{ t('back_to_login') }}</a>
        </p>
    </div>
</div>
{% endblock %}
