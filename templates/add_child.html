{% extends "base.html" %}

{% block title %}{{ t('add_child_title') }} · {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card form-card">
        <h1 class="card-title">{{ t('add_child_title') }}</h1>
        <p class="card-subtitle">{{ t('add_child_subtitle') }}</p>

        <form method="post" action="{{ url_for('add_child') }}" novalidate>
            <div class="field">
                <label for="name">{{ t('label_child_name') }}</label>
                <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="birth_date">{{ t('label_child_birth_date') }}</label>
                    <input type="date" id="birth_date" name="birth_date"
                           value="{{ form.get('birth_date', '') }}" required>
                </div>
                <div class="field">
                    <label for="grade">{{ t('label_child_grade') }}</label>
                    <select id="grade" name="grade" required data-current="{{ form.get('grade', '') }}">
                        <option value="">{{ t('select_placeholder') }}</option>
                    </select>
                    <p class="form-hint" id="grade-hint"></p>
                </div>
            </div>

            <div class="field">
                <label for="country">{{ t('label_country') }}</label>
                <select id="country" name="country" required>
                    <option value="" disabled {{ 'selected' if not form.get('country') else '' }}>
                        {{ t('select_placeholder') }}
                    </option>
                    <option value="HU" {{ 'selected' if form.get('country') == 'HU' else '' }}>
                        {{ t('country_hu') }}
                    </option>
                    <option value="ES" {{ 'selected' if form.get('country') == 'ES' else '' }}>
                        {{ t('country_es') }}
                    </option>
                </select>
            </div>

            <div class="field" id="region-field"
                 style="{{ '' if form.get('country') == 'ES' else 'display:none;' }}">
                <label for="region">{{ t('label_region') }}</label>
                <select id="region" name="region">
                    <option value="" disabled {{ 'selected' if not form.get('region') else '' }}>
                        {{ t('select_placeholder') }}
                    </option>
                    {% for region in spanish_regions %}
                        <option value="{{ region.code }}"
                            {{ 'selected' if form.get('region') == region.code else '' }}>
                            {{ region[lang] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">{{ t('btn_cancel') }}</a>
                <button type="submit" class="btn btn-primary">{{ t('btn_save_child') }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    initCountryRegionToggle();
    (function () {
        var countrySel = document.getElementById('country');
        var gradeSel   = document.getElementById('grade');
        var gradeHint  = document.getElementById('grade-hint');
        var currentGrade = gradeSel.dataset.current || '';

        function isSpain(v) {
            v = (v || '').trim().toLowerCase();
            return v === 'es' || v === 'españa' || v === 'espana' || v === 'spanyolország';
        }

        function rebuildGrades() {
            var max = isSpain(countrySel.value) ? 6 : 8;
            var hint = isSpain(countrySel.value)
                ? '1–6. osztály (Educación Primaria)'
                : '1–8. osztály (általános iskola)';
            gradeSel.innerHTML = '<option value="">{{ t('select_placeholder') }}</option>';
            for (var i = 1; i <= max; i++) {
                var opt = document.createElement('option');
                opt.value = String(i);
                opt.textContent = i + '. osztály';
                if (String(i) === String(currentGrade)) opt.selected = true;
                gradeSel.appendChild(opt);
            }
            gradeHint.textContent = hint;
        }

        countrySel.addEventListener('change', rebuildGrades);
        rebuildGrades();
    })();
</script>
{% endblock %}
