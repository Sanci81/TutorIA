/* determinisztikus véletlen, hogy minden újratöltéskor ugyanaz legyen */
function _mag(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000;};}

function mintaHatter(k, w, h){
  const azon=(k.kep||k.id).split('_').pop();
  const nevek=SZEMELY_MOTIVUM[azon]||["konyv","sorok"];
  const r=_mag(azon), szin=k.szin||"#3f6fd8";
  let g="";
  /* rácsba szórjuk, hogy egyenletesen fedje az oldalt, de ne legyen szabályos */
  const OSZ=7, SOR=5, cw=w/OSZ, ch=h/SOR;
  for(let i=0;i<OSZ*SOR;i++){
    const m=MOTIVUM[nevek[i%nevek.length]]; if(!m) continue;
    const x=(i%OSZ)*cw+cw*(0.15+r()*0.7),
          y=Math.floor(i/OSZ)*ch+ch*(0.15+r()*0.7),
          s=(0.55+r()*1.25), rot=Math.round(-38+r()*76),
          o=(0.075+r()*0.085).toFixed(3);
    if(m.t){
      g+=`<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-family="Georgia,serif"
           font-size="${(46*s).toFixed(0)}" font-weight="700" fill="${szin}"
           opacity="${o}" transform="rotate(${rot} ${x.toFixed(0)} ${y.toFixed(0)})">${m.t}</text>`;
    } else {
      g+=`<g transform="translate(${(x-50*s).toFixed(0)},${(y-50*s).toFixed(0)}) scale(${s.toFixed(2)}) rotate(${rot} 50 50)"
           fill="none" stroke="${szin}" stroke-width="${(3.4/s).toFixed(2)}"
           stroke-linecap="round" stroke-linejoin="round" opacity="${o}"><path d="${m.p}"/></g>`;
    }
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}</svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}
