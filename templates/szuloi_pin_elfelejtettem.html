{% extends "base.html" %}

{# ÚJ SZÜLŐI KÓD A BEJELENTKEZÉSI JELSZÓVAL.
   Enélkül a szülő ki tudná zárni magát a saját fiókjából. #}

{% block content %}
<section class="pin-lap">
  <div class="pin-doboz pin-doboz-szeles">
    <h1>{{ t('pin_elfelejt_cim') }}</h1>
    <p class="pin-alcim">{{ t('pin_elfelejt_alcim') }}</p>

    <form method="post" action="{{ url_for('szuloi_pin_elfelejtettem') }}">
      <label class="pin-cimke" for="jelszo">{{ t('pin_jelszo_cimke') }}</label>
      <input class="pin-szoveg" id="jelszo" type="password" name="jelszo"
             autocomplete="current-password" required>

      <label class="pin-cimke" for="uj_pin">{{ t('pin_uj_cimke') }}</label>
      <input class="pin-szoveg" id="uj_pin" type="password" name="uj_pin"
             inputmode="numeric" pattern="[0-9]*" maxlength="4"
             autocomplete="off" required>

      <button class="btn btn-primary pin-gomb" type="submit">{{ t('pin_mentes') }}</button>
    </form>
  </div>
</section>
{% endblock %}
