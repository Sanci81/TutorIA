{% extends "base.html" %}

{% block title %}{{ t('login_title') }} · {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <h1 class="card-title">{{ t('login_title') }}</h1>

        <form method="post" action="{{ url_for('login') }}" novalidate>
            <div class="field">
                <label for="email">{{ t('label_email') }}</label>
                <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email">
            </div>

            <div class="field">
                <label for="password">{{ t('label_password') }}</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">{{ t('btn_login') }}</button>
        </form>

        <p class="auth-alt">
            {{ t('no_account') }}
            <a href="{{ url_for('register') }}">{{ t('nav_register') }}</a>
        </p>
    </div>
</div>
{% endblock %}
