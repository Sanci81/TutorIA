{% extends "base.html" %}

{% block title %}{{ t('reset_password_title') }} · {{ t('app_name') }}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <h1 class="card-title">{{ t('reset_password_title') }}</h1>
        <p class="card-subtitle">{{ t('reset_password_subtitle') }}</p>

        <form method="post" action="{{ url_for('reset_password', token=token) }}" novalidate>
            <div class="field">
                <label for="password">{{ t('label_password') }}</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle="password"
                            aria-label="{{ t('show_password') }}" data-label-hide="{{ t('hide_password') }}">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M1 1l22 22"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="password_confirm">{{ t('label_password_confirm') }}</label>
                <div class="password-field">
                    <input type="password" id="password_confirm" name="password_confirm" required minlength="6" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-password-toggle="password_confirm"
                            aria-label="{{ t('show_password') }}" data-label-hide="{{ t('hide_password') }}">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <path d="M1 1l22 22"/>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">{{ t('btn_reset_password') }}</button>
        </form>

        <p class="auth-alt">
            <a href="{{ url_for('login') }}">{{ t('back_to_login') }}</a>
        </p>
    </div>
</div>
{% endblock %}
