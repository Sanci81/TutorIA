/* determinisztikus véletlen, hogy minden újratöltéskor ugyanaz legyen */
function _mag(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%100000)/100000;};}

function mintaHatter(k, w, h){
  const azon=(k.kep||k.id).split('_').pop();
  const nevek=SZEMELY_MOTIVUM[azon]||["konyv","sorok"];
  const r=_mag(azon), szin=k.szin||"#3f6fd8";
  let g="";
  /* rácsba szórjuk, hogy egyenletesen fedje az oldalt, de ne legyen szabályos */
  const OSZ=7, SOR=5, cw=w/OSZ, ch=h/SOR;
  for(let i=0;i<OSZ*SOR;i++){
    const m=MOTIVUM[nevek[i%nevek.length]]; if(!m) continue;
    const x=(i%OSZ)*cw+cw*(0.15+r()*0.7),
          y=Math.floor(i/OSZ)*ch+ch*(0.15+r()*0.7),
          s=(0.55+r()*1.25), rot=Math.round(-38+r()*76),
          o=(0.075+r()*0.085).toFixed(3);
    if(m.t){
      g+=`<text x="${x.toFixed(0)}" y="${y.toFixed(0)}" font-family="Georgia,serif"
           font-size="${(46*s).toFixed(0)}" font-weight="700" fill="${szin}"
           opacity="${o}" transform="rotate(${rot} ${x.toFixed(0)} ${y.toFixed(0)})">${m.t}</text>`;
    } else {
      g+=`<g transform="translate(${(x-50*s).toFixed(0)},${(y-50*s).toFixed(0)}) scale(${s.toFixed(2)}) rotate(${rot} 50 50)"
           fill="none" stroke="${szin}" stroke-width="${(3.4/s).toFixed(2)}"
           stroke-linecap="round" stroke-linejoin="round" opacity="${o}"><path d="${m.p}"/></g>`;
    }
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}</svg>`;
  return `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
}

/* A hely száma a kártyában TÁROLT sorszámból jön, nem a lista sorrendjéből.
   Így egy később hozzáadott kártya nem tolja el a meglévők helyét. */
K.forEach(k=>{ const n=k.sorszam||0; k.hely1=n*2-1; k.hely2=n*2; });

const OLDALAK=[{t:"borito"}];
TARGYAK.forEach(t=>{
  const cs=K.filter(x=>x.targy===t);
  OLDALAK.push({t:"szakasz",targy:t,tagok:cs});
  cs.forEach(k=>OLDALAK.push({t:"szemely",k}));
});
OLDALAK.push({t:"checklist"},{t:"hatso"});

let PAKLI=K.map(k=>[{id:k.id+"_a",k:k,hova:k.hely1,arany:false},
                    {id:k.id+"_b",k:k,hova:k.hely2,arany:true}]).flat();
const MIND=PAKLI.slice();
const beragasztva=new Set();
let oldal=0; let HUZOTT=null;
document.getElementById('ossz').textContent=K.length*2;
const lap=document.getElementById('lap'), uzenet=document.getElementById('uzenet');

function helyHTML(k,n,arany){
  if(beragasztva.has(n))
    return `<div class="hely kesz"><img src="${SAJATKEP[n]||KARTYAUT(k,arany)}" ${HIBAKEP}></div>`;
  return `<div class="hely ${arany?'arany':''}" data-n="${n}">
    <span class="szam">${n}</span><span class="fajta">${arany?'ORO':'normal'}</span>
    <span class="q">?</span><span class="lecke">${k.lecke}</span></div>`;
}
function rajzol(){
  const o=OLDALAK[oldal]; lap.style.background="";
  if(o.t==="borito"){
    lap.className="lap borito";
    lap.style.backgroundImage=fedlapHatter("borito")
      +",linear-gradient(165deg,#2b3568,#141a3c 55%,#0b0f22)";
    lap.innerHTML=boritoHTML(T);
  } else if(o.t==="szakasz"){
    lap.className="lap szakasz";
    lap.style.background=`linear-gradient(150deg,${o.tagok[0].szin},#141a3c)`;
    lap.innerHTML=`<div class="szfej"><h2>${o.targy.toUpperCase()}</h2>
       <div class="kicsi" style="margin-top:6px">${o.tagok.length} PERSONAJES</div>
       <div class="db"><b>${o.tagok.length*2}</b><span>CROMOS</span></div></div>
      <div class="arcsor">${o.tagok.map(k=>{
        const van=beragasztva.has(k.hely1)||beragasztva.has(k.hely2);
        return `<div class="arc"><div class="ker ${van?'':'hianyzik'}">
          <img src="${KEPUT(k)}" ${HIBAKEP}></div>
          <div class="n">${k.nev}</div><div class="l">${k.lecke}</div></div>`;}).join('')}</div>`;
  } else if(o.t==="szemely"){
    const k=o.k; lap.className="lap szemely";
    lap.style.backgroundImage=mintaHatter(k,1100,760);
    lap.style.backgroundSize="cover";
    lap.style.backgroundRepeat="no-repeat";
    lap.innerHTML=`
     <div class="sz-tag" style="background:${k.szin}">${k.rovid} · ${k.ciclo}</div>
     <div class="sz-fejlec"><div class="sz-nev">${k.nev}</div>
       <div class="sz-alnev" style="color:${k.szin}">${k.alnev}</div></div>
     <div class="sz-torzs" style="--fo:${k.szin}">
      <div class="sz-bal">
       <div class="sz-kep"><img src="${KEPUT(k)}" ${HIBAKEP}>
         <span class="nincs">todavía no hay retrato en la carpeta:<br>static/kartyak/es/${k.kep}.png</span></div>
       <div class="becenev" style="background:${k.szin}"><b>${k.becenev}</b><span>${k.leiras}</span></div>
       <div class="dobozok">
        <div class="doboz"><b>EL DATO</b><span>${k.teny}</span></div>
        <div class="doboz kek"><b>LO QUE CASI NADIE SABE</b><span>${k.erd}</span></div></div>
      </div>
      <div class="sz-jobb">
       <div class="adatlap"><div class="fej">FICHA</div><table>
         <tr><td>Área</td><td>${k.targy}</td></tr>
         <tr><td>Vivió</td><td>${k.alnev.split('· ')[1]||''}</td></tr>
         <tr><td>Habilidad</td><td>${k.kepesseg}</td></tr>
         <tr><td>Fuerza</td><td>${k.ero}</td></tr>
         <tr><td>Rareza</td><td>${k.csillag} ${k.cimke}</td></tr>
         <tr><td>Tema</td><td>${k.lecke}</td></tr></table></div>
       <div class="helyek">${helyHTML(k,k.hely1,false)}${helyHTML(k,k.hely2,true)}</div>
       <div class="idezet">${k.mtip==="idezet"?("«"+k.idezet+"»"):k.idezet}</div>
      </div></div>`;
    kotesek();
  } else if(o.t==="checklist"){
    lap.className="lap checklist";
    let h=`<h2>CHECKLIST</h2>`;
    TARGYAK.forEach(t=>{
      h+=`<div class="clsz">${t.toUpperCase()}</div><div class="clracs">`;
      K.filter(x=>x.targy===t).forEach(k=>{
        [[k.hely1,''],[k.hely2,' ★']].forEach(([n,cs])=>{
          const van=beragasztva.has(n);
          h+=`<div class="cl ${van?'van':''}"><div class="k">${van
            ?`<img src="${KEPUT(k)}" ${HIBAKEP}>`:'<span>?</span>'}</div>
            <div class="sav"><span class="box">${van?'✓':''}</span>
            <span class="n">${n}${cs}</span></div></div>`;});});
      h+=`</div>`;});
    lap.innerHTML=h;
  } else {
    lap.className="lap hatso";
    lap.style.backgroundImage=fedlapHatter("hatso")
      +",linear-gradient(200deg,#1e2650,#101638 55%,#080b18)";
    lap.innerHTML=hatsoHTML(T);
  }
  document.getElementById('oldalszam').textContent=`${oldal+1} / ${OLDALAK.length}`;
  document.getElementById('elore').disabled=oldal===0;
  document.getElementById('hatra').disabled=oldal===OLDALAK.length-1;
  document.getElementById('db').textContent=beragasztva.size;
}
function kotesek(){
  lap.querySelectorAll('.hely[data-n]').forEach(h=>{
    h.style.cursor='pointer';
    h.addEventListener('click',()=>{varToltes=Number(h.dataset.n);kepFile.click();});
    h.addEventListener('dragover',e=>{e.preventDefault();
      const c=PAKLI.find(x=>x.id===HUZOTT);
      if(c && Number(h.dataset.n)!==c.hova){h.classList.add('tiltott');e.dataTransfer.dropEffect='none';return;}
      h.classList.add('rahuz');});
    h.addEventListener('dragleave',()=>h.classList.remove('rahuz','tiltott'));
    h.addEventListener('drop',e=>{e.preventDefault();h.classList.remove('rahuz');
      const id=e.dataTransfer.getData('text/plain');
      const c=PAKLI.find(x=>x.id===id); if(!c) return;
      if(Number(h.dataset.n)===c.hova){
        beragasztva.add(c.hova); PAKLI=PAKLI.filter(x=>x.id!==id);
        uzenet.className='uzenet jo';
        uzenet.textContent=`¡Conseguido! ${c.k.nev}${c.arany?' (dorado)':''} ya está en su sitio.`;
        rajzol(); pakli();
      } else {
        h.classList.add('rossz'); setTimeout(()=>h.classList.remove('rossz'),400);
        uzenet.className='uzenet baj';
        uzenet.textContent='Ahí no va. ¿En qué área y en qué tema lo estudiaste?';
      }});});
}
function pakli(){
  const p=document.getElementById('pakli');
  if(!PAKLI.length){p.innerHTML='<div style="opacity:.5;padding:18px">Has pegado todos los cromos.</div>';return;}
  p.innerHTML=PAKLI.slice(0,40).map(c=>`<div class="mini ${c.arany?'aranylap':''}" draggable="true" data-id="${c.id}">
     <span class="cimke">${c.hova}</span>
     <img src="${KARTYAUT_SZIG(c.k,c.arany)}" ${HIBAKEP}><div class="c">${c.k.nev}</div></div>`).join('');
  p.querySelectorAll('.mini').forEach(m=>m.addEventListener('dragstart',e=>{
    e.dataTransfer.setData('text/plain',m.dataset.id); HUZOTT=m.dataset.id;
    uzenet.className='uzenet';uzenet.textContent='';}));
}
document.getElementById('elore').addEventListener('click',()=>{if(oldal>0){oldal--;rajzol();}});
document.getElementById('hatra').addEventListener('click',()=>{if(oldal<OLDALAK.length-1){oldal++;rajzol();}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
rajzol(); pakli();

/* csak azok a lapok kerulnek a pakliba, amelyeknek tenyleg van kepuk */
(async () => {
  const jo = [];
  for (const c of PAKLI) if (await kepBetolt(KARTYAUT_SZIG(c.k, c.arany))) jo.push(c);
  PAKLI = jo;
  pakli();
})();

</script></body></html>
