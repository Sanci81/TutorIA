<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  /* A gyerek által megvásárolt kinézet. A háttér a kinezet.py-ból jön, és
     ugyanaz a CSS érték, amit a kinézet-boltban előnézetként lát. */
  .chat-messages{background: !important}
  .chat-coins-pill{cursor:pointer;text-decoration:none;color:inherit}

  /* ══ LECKE-SÍN ═══════════════════════════════════════════════════════
     Eddig a gyerek nem tudta, hol tart és mikor lesz vége — csak
     görgetett lefelé egy végtelen chatben. Itt négy állomás látszik, és
     a SAJÁT avatarja csúszik végig rajtuk. Ez adja meg a leckének azt,
     ami eddig hiányzott: hogy van eleje és van vége. */
  .lecke-sin-doboz{padding:26px 22px 10px;background:rgba(255,255,255,.92);
                   border-bottom:1px solid rgba(0,0,0,.07)}
  .lecke-sin{position:relative;height:9px;background:#e3ebf2;border-radius:6px;
             margin:0 8px}
  .lecke-sin-kesz{position:absolute;left:0;top:0;bottom:0;width:8%;
                  border-radius:6px;background:linear-gradient(90deg,#5bc0a8,#3fa88f);
                  transition:width .6s ease}
  .lecke-allomas{position:absolute;top:50%;width:20px;height:20px;
                 margin:-10px 0 0 -10px;border-radius:50%;background:#fff;
                 border:3px solid #cdd9e3;transition:border-color .4s,background .4s}
  .lecke-allomas.kesz{border-color:#3fa88f;background:#3fa88f}
  .lecke-allomas.kesz::after{content:"✓";color:#fff;font-size:11px;font-weight:700;
                             position:absolute;inset:0;display:flex;
                             align-items:center;justify-content:center}
  .lecke-allomas b{position:absolute;top:22px;left:50%;transform:translateX(-50%);
                   font-size:10.5px;color:#7b8fa3;white-space:nowrap;font-weight:600}
  .lecke-avatar{position:absolute;top:-24px;transform:translateX(-50%);
                width:40px;height:40px;border-radius:50%;background:#ffd77a;
                border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.22);
                display:flex;align-items:center;justify-content:center;
                font-size:22px;font-weight:700;color:#7a5c14;overflow:hidden;
                transition:left .7s cubic-bezier(.4,1.4,.5,1);z-index:2}
  .lecke-avatar img{width:100%;height:100%;object-fit:cover;display:block}

  /* ══ HÁTRALÉVŐ IDŐ ═══════════════════════════════════════════════════
     Egy sor a sín alatt. Nem riogat és nem versenyeztet: csak megmondja,
     mennyi van még — ettől lesz a leckének vége, nem csak eleje. */
  .lecke-hatra{margin:34px 8px 0;font-size:12.5px;color:#5c7386;
               font-weight:600;letter-spacing:.01em;text-align:right}

  /* ══ ÉRME-CSÍK ═══════════════════════════════════════════════════════
     A kártya NEM jár a leckéért — érméért veszi meg a boltban. Ez a csík
     csak azt mutatja, mennyi hiányzik még a legolcsóbb tasakhoz. */
  .erme-csik{display:flex;align-items:center;gap:11px;margin:14px 8px 0;
             font-size:12.5px;color:#7a5c14}
  .erme-sav{flex:1;height:7px;background:#f0e2c2;border-radius:5px;overflow:hidden}
  .erme-sav i{display:block;height:100%;width:0;border-radius:5px;
              background:linear-gradient(90deg,#f5c451,#e8a317);
              transition:width .6s ease}

  /* ══ VÁLASZTÓGOMBOK ══════════════════════════════════════════════════
     Eddig a gyerek csak VÁLASZOLT. Ezekkel dönt is: kérhet nehezebbet,
     példát, vagy továbbmehet. Nem AI-logika, csak három előre megírt
     mondat — de a gyerek irányít, és ettől lesz játék a chatből. */
  .chat-valaszto{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px 8px}
  .chat-valaszto-gomb{border:1.5px solid #cfdce7;background:#fff;color:#2c4a68;
                      font:600 13.5px/1.2 inherit;padding:9px 15px;
                      border-radius:20px;cursor:pointer}
  .chat-valaszto-gomb:hover{border-color:#3fa88f;background:#f2fbf8}
  .chat-valaszto-gomb:disabled{opacity:.5;cursor:default}

  @media (max-width:600px){
    .lecke-sin-doboz{padding:24px 12px 10px}
    .lecke-allomas b{font-size:9.5px}
    .lecke-avatar{width:34px;height:34px;top:-21px}
  }
  /* ══ MUNKATÉR ════════════════════════════════════════════════════════
     A feladat kikerül a buborékból, és saját felületet kap. Ha van
     feladat, a beszélgetés jobbra szorul, keskeny kommentár-oszlopba.
     Ha nincs, minden marad a régiben – a .van-munka osztály kapcsol. */
  .munka-sav{display:flex;flex-direction:column;min-height:0;flex:1}
  .munka-sav.van-munka{display:grid;grid-template-columns:1fr minmax(280px,340px);
                       gap:14px;align-items:stretch}
  .munkater{background:#fff;border:1px solid #e2e9f0;border-radius:14px;
            padding:20px 22px;min-width:0;overflow:auto}
  .munkater-cim{margin:0 0 3px;font-size:17px;line-height:1.3}
  .munkater-utasitas{margin:0 0 18px;font-size:13.5px;line-height:1.5;color:#61788f}
  .munkater-test{display:flex;justify-content:flex-start}
  /* a feladat a munkatérben ne örökölje a buborék szűk méreteit */
  .munkater .feladat{margin:0;max-width:none}

  .munka-sav.van-munka .chat-messages{min-width:0}

  /* Telefonon nincs két oszlop: a munkatér FELÜL van, a beszélgetés alatta. */
  @media (max-width:820px){
    .munka-sav.van-munka{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .munkater{padding:16px 14px}
  }


  /* ══ ÚJ MUNKAFELÜLET ═════════════════════════════════════════════════
     Megfordítjuk a képernyőt: ami eddig a beszélgetésben folyt – a tanár
     magyarázata –, az átkerül a munkatérre, nagy betűvel, és a
     beszélgetés szorul mellé keskeny oszlopba. A gyerek így nem egy
     végtelen chatet görget, hanem egy táblát néz.

     MINDEN szabály a .uj-felulet osztály alatt van, azt pedig csak a
     ?felulet=uj kapcsolja be. Kikapcsolva az oldal egy pixelt sem
     változik – ezért lehet élesben kipróbálni. */
  /* A MEGVÁSÁROLT KINÉZET A KERETET FESTI, nem a szöveg alját.
     Így a gyerek látja, mit vett, a tábla viszont tiszta fehér marad,
     és egyetlen betű sem lesz olvashatatlan – akármilyen mintát teszünk
     be később. */
  /* A MEGVÁSÁROLT KINÉZET AZ EGÉSZ OLDALT FESTI.
     Eddig csak a munkatér 14 pixeles kerete volt az, amit a gyerek megvett –
     alig lehetett észrevenni, hogy egyáltalán van kinézete. Mögötte ráadásul
     ott futott a mindenkinek egyforma iskolai háttér, ami el is nyomta.
     Innentől az egész lap az övé, a tábla és a beszélgetés pedig egy
     hajszálnyit áttetsző, így a minta halványan átsejlik alattuk is. */
  body.gyerek-hatter{background: !important;
      background-attachment:fixed !important}
  .munka-sav.uj-felulet{background:transparent;
      border-radius:22px;padding:16px;position:relative}
  .munka-sav.uj-felulet,
  .munka-sav.uj-felulet.van-munka{
      display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);
      grid-template-areas:"bal beszelo";
      grid-template-rows:minmax(0,1fr);gap:16px;align-items:start}
  /* A tábla és a feladat EGY oszlopban, saját görgetéssel. Enélkül
     nagyításban a hosszú magyarázat alja levágódott, és oda sem
     lehetett görgetni. */
  .uj-felulet .bal-oszlop{grid-area:bal;display:flex;flex-direction:column;
      gap:14px;min-width:0;min-height:0}
  .munka-sav.uj-felulet.csukva,
  .munka-sav.uj-felulet.csukva.van-munka{grid-template-columns:1fr 54px}

  .uj-felulet #beszelo{grid-area:beszelo}

  /* ── a tábla: itt tanít a tanár ── */
  /* A BOLTBAN VETT KINÉZET a táblát díszíti. Eddig a beszélgetés
     hátterét festette – csakhogy az új felületen a beszélgetés egy
     keskeny sáv, ott alig látszott, amit a gyerek megvett. A tábla a
     legnagyobb felület, ott van értelme. Minden kinézet világos
     színátmenet, tehát a fekete szöveg olvasható marad rajta. */
  .uj-felulet .tanit{background:rgba(255,255,255,.90);border:1px solid #e2e9f0;
      border-radius:18px;padding:22px 26px 20px;min-width:0}
  .uj-felulet .tanit-fej{display:flex;align-items:center;gap:10px;
      margin:0 0 12px}
  .uj-felulet .tanit-cim{margin:0;font-size:15px;font-weight:700;
      color:#5b3fa8;letter-spacing:.02em;flex:1;min-width:0}
  .uj-felulet .tanit-hang{border:0;background:#eef4f1;border-radius:9px;
      width:30px;height:30px;cursor:pointer;font-size:15px;flex:0 0 auto}
  .uj-felulet .tanit-szoveg{margin:0;font-size:17.5px;line-height:1.62;
      white-space:pre-wrap;max-width:58ch;color:#1f2d3a}
  .uj-felulet .tanit-abra{margin:16px 0 0;max-width:340px}
  .uj-felulet .tanit-abra svg{width:100%;height:auto;display:block;
      background:#fff;border-radius:8px}
  /* Kép (tantárgyi kép, képes szótár) a táblán – ugyanott, ahol a rajz. */
  .uj-felulet .tanit-abra img{width:100%;max-width:260px;height:auto;display:block;
      background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(20,60,40,.12)}
  .uj-felulet .tanit-var{color:#8aa0b2;font-style:italic}

  /* ── a keskeny beszélgetés-sáv ── */
  .uj-felulet .beszelo{background:rgba(255,255,255,.90);border:1px solid #e2e9f0;
      border-radius:18px;padding:14px 12px;display:flex;
      flex-direction:column;min-width:0;max-height:72vh}
  .uj-felulet .beszelo-fej{display:flex;align-items:center;gap:8px;
      margin-bottom:8px}
  .uj-felulet .beszelo-cim{flex:1;min-width:0;font:700 11.5px/1.2 inherit;
      letter-spacing:.06em;text-transform:uppercase;color:#7b8fa3}
  .uj-felulet .beszelo-csuk{border:0;background:#eef4f1;border-radius:8px;
      width:28px;height:28px;cursor:pointer;color:#61788f;font-size:15px;
      flex:0 0 auto}
  .uj-felulet .beszelo .chat-messages{max-height:none;min-height:0;flex:1;
      padding:2px;background:transparent !important}
  .uj-felulet .beszelo .chat-bubble{max-width:100%}

  /* ══ EZ VOLT A „GONDOLKODOM" IGAZI HIBÁJA ═══════════════════════════
     A programban a jelző elrejtése így történik:  typing.hidden = true;
     A `hidden` attribútum viszont csak addig hat, amíg valamelyik
     stíluslap rá nem ír egy `display` értéket — és a buborékok stílusa
     pont ezt teszi (display:flex). A böngésző ilyenkor a stíluslapnak
     hisz, nem a `hidden`-nek, ezért a jelző AKKOR IS a képernyőn maradt,
     amikor a program már rég elrejtette. Hiába volt jó a JavaScript.
     Ez a sor mondja ki, hogy az elrejtett jelző TÉNYLEG tűnjön el. */
  #typing-indicator[hidden]{display:none !important}
  .chat-bubble[hidden]{display:none !important}
  .uj-felulet .beszelo .chat-bubble-inner{font-size:15px;line-height:1.5;
      padding:.7rem .85rem;border-radius:14px}
  .uj-felulet .beszelo .chat-figure{display:none}
  .uj-felulet .beszelo .chat-input-bar{margin-top:8px;padding-top:10px}
  .uj-felulet .beszelo .chat-input-bar textarea{font-size:14px;
      min-height:2.6rem;padding:.55rem .7rem;border-radius:14px}
  .uj-felulet .beszelo .chat-send-btn{padding:.6rem .9rem;font-size:13.5px}
  .uj-felulet .beszelo .chat-valaszto{margin-left:0}
  .uj-felulet .beszelo .chat-valaszto-gomb{font-size:12.5px;padding:7px 12px}

  .uj-felulet .beszelo-fuggoleges{display:none;writing-mode:vertical-rl;
      margin:10px auto 0;font:600 12px/1 inherit;color:#7b8fa3;
      letter-spacing:.06em}
  .uj-felulet.csukva .beszelo{padding:12px 6px;align-items:center}
  .uj-felulet.csukva .beszelo-cim,
  .uj-felulet.csukva .beszelo .chat-messages,
  .uj-felulet.csukva .beszelo-utalas,
  .uj-felulet.csukva .beszelo .chat-input-bar{display:none}
  .uj-felulet.csukva .beszelo-fuggoleges{display:block}

  /* ══ HANGOS MÓD ══════════════════════════════════════════════════════
     A mikrofon GOMB MÉRETE NEM VÁLTOZIK – 80×80 marad, ahogy eddig is.
     Csak a körülötte lévő üres helyet vesszük el: a panel függőleges
     doboz helyett egy tömör alsó sáv lesz, a felirat a gomb MELLÉ kerül,
     nem alá. Ettől a beszélgetésnek marad a többi magasság. */
  .uj-felulet .beszelo .voice-panel{flex:0 0 auto;flex-direction:row;
      align-items:center;justify-content:flex-start;gap:12px;
      padding:10px 2px 2px;margin-top:9px;background:transparent;
      border-top:1px solid #edf1f5;border-radius:0;text-align:left;
      flex-wrap:wrap}
  .uj-felulet .beszelo .voice-mic-btn{order:1;flex:0 0 auto}
  .uj-felulet .beszelo .voice-status{order:2;flex:1;min-width:0;
      font-size:.98rem;line-height:1.3}
  .uj-felulet .beszelo .voice-unsupported{order:3;flex:1 0 100%;
      max-width:none;margin-top:4px}

  /* ÖSSZECSUKVA a mikrofon a TÁBLA SARKÁBA úszik – ugyanakkorán.
     Enélkül a gyerek nem tud megszólalni, amíg a sáv be van csukva. */
  /* A gomb a TÁBLA sarkába kerül, nem az összecsukott csíkra: a csík
     54 képpont széles, plusz a rés – ezért 92 képpont a jobb margó. */
  .uj-felulet.csukva .beszelo .voice-panel{position:absolute;
      right:92px;bottom:22px;z-index:30;margin:0;padding:0;border-top:0;
      gap:0;width:auto}
  .uj-felulet.csukva .beszelo .voice-status,
  .uj-felulet.csukva .beszelo .voice-unsupported{display:none}
  .uj-felulet.csukva .beszelo .voice-mic-btn{
      box-shadow:0 8px 22px rgba(20,60,40,.32);border:3px solid #fff}

  /* A LEGUTOLSÓ tanári üzenet csak a TÁBLÁN áll. A sávban a helyén egy
     halvány sor mutat a táblára – különben ugyanaz a kérdés kétszer
     szerepel, és nem derül ki, hol kell válaszolni. Amint a gyerek
     válaszol, ez a jelölés a KÖVETKEZŐ üzenetre ugrik, az előző pedig
     visszakerül a naplóba. Semmi nem vész el. */
  .uj-felulet .beszelo .chat-bubble.tablan{display:none}
  .uj-felulet .beszelo-utalas{border:1px dashed #cfdce7;background:#f8fbfd;
      color:#6b7c74;border-radius:13px;padding:11px 12px;font-size:13px;
      line-height:1.45;margin:2px 0 8px}
  .uj-felulet .beszelo-utalas b{color:#2c4a68;display:block}
  .uj-felulet .beszelo-utalas[hidden]{display:none}

  /* TELJES KÉPERNYŐN a tábla is kapjon saját görgetést. Enélkül a
     .chat-layout.teljes-mod overflow:hidden szabálya egyszerűen levágja
     az ábra alját, és oda sem lehet görgetni. */
  .chat-layout.teljes-mod .munka-sav.uj-felulet{min-height:0;height:100%;
      align-items:stretch}
  .chat-layout.teljes-mod .uj-felulet .bal-oszlop{height:100%;min-height:0;
      overflow-y:auto;overflow-x:hidden;padding-right:4px}
  .chat-layout.teljes-mod .uj-felulet .beszelo{max-height:100%}

  /* ══ A KABALA HELYE ═══════════════════════════════════════════════════
     Sándor kérése: rendes nézetben a lap BAL ALSÓ sarkában, nagyításban a
     JOBB ALSÓ sarokban legyen a figura.

     Ehhez kivesszük a rácsból (position:absolute), és így a rácsnak nem
     kell neki külön oszlopot fenntartania – a tanulás felülete megkapja
     azt a 200-300 képpontot, ami eddig üresen állt mellette.

     FIGYELEM: az oszlopszámot CSAK azért írjuk felül, mert a figura már
     nem rácselem. Amikor korábban rácselemként hagytam és mégis
     felülírtam, a figura egy új sorba csúszott a képernyőn kívülre. */
  @media (min-width:901px){
    /* ══ A LAP NE GÖRÖGJÖN – CSAK A TÁBLA BELSEJE ═══════════════════════
       A magasságot a lap alján lévő kis szkript méri ki (--munka-magas),
       mert a fejléc és a lábléc magassága oldalanként más. Ha a lap nem
       görög, a figura egy helyben marad és mindig látszik.

       MINDEN szabály :not(.teljes-mod) – nagyításban SEMMIHEZ nem nyúlunk.
       Egyszer a szójegyzékes oszlopszabályt nem zártam ki innen, és
       nagyításban a szójegyzék széthúzódott az egész képernyőre. */
    .chat-layout:not(.teljes-mod):has(.uj-felulet){
        height:var(--munka-magas, calc(100vh - 210px));min-height:800px}
    .chat-layout:not(.teljes-mod):has(.uj-felulet) .chat-main{
        min-height:0;display:flex;flex-direction:column}
    .chat-layout:not(.teljes-mod):has(.uj-felulet) .munka-sav.uj-felulet{
        min-height:0;flex:1 1 auto;align-items:stretch}

    /* A tábla ÉS a feladat EGY görgetésben. A .munkater eddig külön
       görgetődött, ezért látszott alul egy külön kis doboz levágva. */
    .chat-layout:has(.uj-felulet) .uj-felulet .bal-oszlop{
        min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:6px}
    .chat-layout:has(.uj-felulet) .uj-felulet .munkater{
        overflow:visible;flex:0 0 auto}
    .chat-layout:not(.teljes-mod):has(.uj-felulet) .uj-felulet .beszelo{
        max-height:100%}

    /* A TÉMALISTA rövidebb lesz, hogy a figurának saját helye legyen alul:
       így nem lóg bele a szövegbe. A lista magától görög tovább. */
    /* A min-height nélkül alacsony ablakban a calc() nullára vagy negatívra
       futhat, és a lista NÉMÁN eltűnik – úgy néz ki, mintha az adott
       tantárgyhoz nem is volna témakör. Innentől mindig marad hely neki. */
    .chat-layout:not(.teljes-mod):has(.uj-felulet) .topic-sidebar{
        align-self:start;height:calc(100% - 320px);min-height:220px;
        max-height:none}

    /* A FIGURA EGY HELYBEN: a felület bal alsó sarkában, a témalista alatt. */
    .chat-layout:has(.uj-felulet) .chat-kabala-oszlop{
        position:absolute;left:0;bottom:8px;right:auto;top:auto;
        width:280px;height:300px;z-index:5;pointer-events:none;
        display:flex;align-items:flex-end;justify-content:center}
    /* KÉP (kisfiú, kislány): 150 képpont jó rá.
       ROBOT: a rajzvászon körül sok az üres hely, ezért a DOBOZA 280. */
    /* A figura MAGASSÁGA is korlátos (300), nem csak a szélessége. Enélkül
       a kisfiú képe kb. 325 magas lett, kilógott a neki fenntartott sávból,
       és rálógott a témalistára, illetve nagyításban a szójegyzékre. */
    .chat-layout:has(.uj-felulet) .chat-kabala{position:static;max-width:150px;
        max-height:100%;width:auto;object-fit:contain}
    /* A képes, reagáló kabala 400×600-as (a figura körül kis hely van). */
    .chat-layout:has(.uj-felulet) .chat-kabala.kabala-allapotos{max-width:200px}
    .chat-layout:has(.uj-felulet) .chat-kabala-doboz{position:static;
        max-width:280px;max-height:100%}

    /* CSAK a rendes nézet lesz szélesebb. */
    .chat-layout:not(.teljes-mod):has(.uj-felulet){
        grid-template-columns:260px minmax(0,1fr)}
    /* NYELVÓRÁN a szójegyzék a FEJLÉC sávjába kerül, jobb oldalra – és a
       tanulás felülete alatta TELJES szélességben kimegy a szélig, pont
       úgy, mint egy sima tantárgynál. A magasságát a lap alján lévő
       szkript méri ki (--fejlec-magas). Ugyanaz a fogás, mint a
       kabala figuránál: kivesszük a rácsból, és odatesszük, ahova kell.
       NAGYÍTÁSBAN ez NEM érvényes – ott marad az oszlop. */
    .chat-layout:not(.teljes-mod):has(.uj-felulet):has(.chat-sidebar-vocab){
        grid-template-columns:260px minmax(0,1fr)}
    /* A fejléc ÉS a lecke-sín doboza is itt áll meg – a sín egy külön
       doboz a fejlécen KÍVÜL, ezért kellett neki is a szabály.
       Enélkül a csúszka benyúlt a szójegyzék alá. */
    .chat-layout:not(.teljes-mod):has(.uj-felulet):has(.chat-sidebar-vocab)
        .chat-header,
    .chat-layout:not(.teljes-mod):has(.uj-felulet):has(.chat-sidebar-vocab)
        .lecke-sin-doboz{margin-right:214px}

    /* Az érme-csík közvetlenül a sín alatt: az állomások feliratai
       (Tanulás, Gyakorlás…) a sín alá lógnak, és a csík átment rajtuk.
       Csak akkor kap több helyet, ha nincs közte a „még ennyi perc" sor. */
    .chat-layout:has(.uj-felulet) .lecke-sin + .erme-csik{margin-top:30px}
    .chat-layout:not(.teljes-mod):has(.uj-felulet) .chat-sidebar-vocab{
        position:absolute;right:0;top:0;width:200px;
        height:var(--fejlec-magas,240px);max-height:none;
        overflow-y:auto;margin:0;z-index:4}

    /* ALACSONY ABLAK: ha a felület 560 képpontnál alacsonyabb, a figura
       elveszi a helyet a témalista elől. Ilyenkor inkább nincs figura –
       ugyanaz az elv, mint a keskeny képernyőn. */
    .chat-layout.alacsony:has(.uj-felulet) .chat-kabala-oszlop{display:none}
    .chat-layout.alacsony:not(.teljes-mod):has(.uj-felulet) .topic-sidebar{
        height:100%}
    .chat-layout.alacsony.teljes-mod:has(.uj-felulet) .chat-sidebar-vocab{
        height:100%}

    /* Nagyításban a jobb oldali üres sávban, középen. */
    /* NAGYÍTÁSBAN NE ZSUGORODJON A FIGURA. Korábban 200 képpont volt, a
       rendes nézetben viszont 280 — ezért tűnt a teljes képernyős mód
       ellenére KISEBBNEK. Most ugyanakkora, mint a rendes nézetben. */
    .chat-layout.teljes-mod:has(.uj-felulet) .chat-kabala-oszlop{
        left:auto;right:16px;width:280px;bottom:12px}

    /* NYELVÓRÁN nagyításban a szójegyzék ugyanabban a sávban van, mint a
       figura, ezért a figura rálógott a szavakra. A szójegyzék rövidebb
       lesz (magától görög tovább), a figura alatta kap helyet.
       Ez CSAK a szójegyzékes órákra vonatkozik – magyar és spanyol
       oldalon egyformán, mert ugyanez a sablon szolgálja ki mindkettőt. */
    .chat-layout.teljes-mod:has(.uj-felulet) .chat-sidebar-vocab{
        align-self:start;height:calc(100% - 340px);max-height:none}
  }
  @media (min-width:1600px){
    .chat-layout.teljes-mod:has(.uj-felulet) .chat-kabala-oszlop{
        width:340px}
  }

  @media (min-width:1000px) and (max-width:1279px){
    .munka-sav.uj-felulet,
    .munka-sav.uj-felulet.van-munka{
        grid-template-columns:minmax(0,1fr) minmax(230px,260px)}
  }

  /* ══ KÉSZ TÉMAKÖR JELZÉSE A ☰ GOMBON ═══════════════════════════════
     Ha a gyerek befejez egy témakört, a bal szélen lévő zöld gomb
     ARANYSZÍNŰ lesz és pipát kap. Így ott, ahol a témalista amúgy is
     nyílik, egy pillantással látszik, hogy történt valami. A jelzés
     akkor tűnik el, amikor a gyerek kinyitja a listát. */
  .chat-sidebar-toggle.tema-kesz{
      background:linear-gradient(135deg,#f5c451,#e8a317);color:#4a3406;
      box-shadow:0 0 0 3px rgba(245,196,81,.35),0 6px 18px rgba(0,0,0,.2)}
  .chat-sidebar-toggle.tema-kesz::after{
      content:"✓";position:absolute;top:-6px;right:-6px;width:19px;height:19px;
      border-radius:50%;background:#1f6f43;color:#fff;font-size:12px;
      font-weight:700;display:flex;align-items:center;justify-content:center;
      box-shadow:0 2px 6px rgba(0,0,0,.25)}

  /* A fiók fölötti sötét felület: erre koppintva is becsukódik. */
  .sidebar-fatyol{position:fixed;inset:0;background:rgba(12,38,28,.38);
      z-index:45;display:none}
  .sidebar-fatyol.lathato{display:block}
  @media (max-width:900px){
    /* A ☰ / ✕ gomb a fiók FÖLÖTT van, különben a kinyílt fiók eltakarja.
       A HELYÉT nem szabad átírni: az eredeti szabály a bal szélre, függőleges
       közepére rögzíti (position:fixed). Egyszer relative-re vettem, és a
       gomb beesett a lap folyamába – egy zöld sáv lett a lista közepén. */
    .chat-sidebar-toggle{z-index:60}
    .topic-sidebar.open{box-shadow:0 0 40px rgba(0,0,0,.25)}
  }

  /* ══ TABLET (760–900) ═══════════════════════════════════════════════
     Itt már ELFÉR a tábla és a beszélgetés egymás mellett, ezért ugyanazt
     kapja, mint az asztali gép – csak keskenyebb beszélgetés-sávval.
     A lap magassága NINCS lezárva: tableten görögjön nyugodtan. */
  @media (min-width:760px) and (max-width:900px){
    .munka-sav.uj-felulet,
    .munka-sav.uj-felulet.van-munka{
        display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,290px);
        grid-template-areas:"bal beszelo";
        grid-template-rows:minmax(0,1fr);gap:12px;align-items:start}
    .uj-felulet .beszelo{max-height:78vh}
    .chat-layout:has(.uj-felulet) .chat-kabala-oszlop{display:none}
  }

  /* ══ TELEFON (760 alatt) ═════════════════════════════════════════════
     Egy felület, három állapot – nincs oda-vissza kapcsolgatás:

       felül   a lecke fejléce és a csúszka,
       középen a MAGYARÁZAT (a megvásárolt háttérrel a keretén),
       alul    egy sáv, ami MINDIG ott van: írásos módban a válaszmező és
               a Küldés, hangos módban a mikrofon; alattuk három feliratos
               gomb (Beszélgetés, másik mód, Témakörök).

     A beszélgetés egy FELHÚZHATÓ lap: a lecke ott marad mögötte, tehát a
     kérdés nem tűnik el, és a gyereknek soha nem kell görgetnie ahhoz,
     hogy válaszolni tudjon. Korábban a válaszmező 1006 képpont mélyen volt.

     A sáv magasságát a szkript méri ki (--sav-magas), mert írásos és
     hangos módban más. */
  .mobil-sav{display:none}
  /* Telefonos teljes képernyő: csak a weboldal fejléce és lábléce tűnik el. */
  html.mobil-teljes header.navbar,
  html.mobil-teljes footer.footer{display:none}
  @media (max-width:759px){
    /* Amikor feladat van kint, a magyarázat alján nem kell a figurának
       fenntartott 96 képpont, és a figura sem lóghat bele a feladatba. */
    .uj-felulet:has(#munkater:not([hidden])) .tanit{padding-bottom:18px;min-height:0 !important}
    /* A feladat fölött a lecke neve még egyszer: telefonon csak a helyet viszi. */
    .munkater-cim{display:none}
    /* A pizza és az óra ne töltse ki az egész képernyőt: a Kész gomb is látsszon. */
    .ie-svg.ie-pizza,.ie-svg.ie-ora{max-width:230px}
    /* Kisebb belső margó: a keskeny képernyőn minden képpont a feladaté. */
    .uj-felulet .munkater{padding:12px 8px}
    .uj-felulet .munkater .feladat{padding:12px 8px}
    .chat-layout:has(#munkater:not([hidden])) .chat-kabala-oszlop{display:none !important}
    .chat-layout:has(.uj-felulet){padding-bottom:var(--sav-magas,170px)}
    .munka-sav.uj-felulet,
    .munka-sav.uj-felulet.van-munka,
    .munka-sav.uj-felulet.csukva,
    .munka-sav.uj-felulet.csukva.van-munka{
        grid-template-columns:1fr;grid-template-rows:auto;
        grid-template-areas:"bal";gap:10px;padding:12px;position:relative}
    .uj-felulet .bal-oszlop{max-height:none;overflow:visible}
    /* A lap ÁTTETSZŐ, hogy a megvásárolt háttér telefonon is látsszon. */
    .uj-felulet .tanit{background:rgba(255,255,255,.93);
        padding:18px 16px 96px}
    .uj-felulet .tanit-szoveg{font-size:16.5px;max-width:none}
    .uj-felulet .beszelo-csuk{display:none}

    /* A FIGURA a magyarázat bal alsó sarkában – ott csak üres hely van,
       a szövegbe nem lóg bele (a lap alján 96 képpont a belső szegély). */
    .chat-layout:has(.uj-felulet) .chat-kabala-oszlop{
        display:flex;position:absolute;left:20px;bottom:10px;top:auto;
        right:auto;width:84px;height:84px;z-index:3;pointer-events:none;
        align-items:flex-end;justify-content:center}
    .chat-layout:has(.uj-felulet) .chat-kabala{position:static;
        max-width:84px;max-height:84px;width:auto}
    .chat-layout:has(.uj-felulet) .chat-kabala-doboz{position:static;
        max-width:84px;max-height:84px}

    /* A BESZÉLGETÉS felhúzható lap. */
    .uj-felulet .beszelo{position:fixed;left:0;right:0;top:auto;
        bottom:var(--sav-magas,170px);height:56vh;max-height:none;
        /* Telefonon ez a lap FÖLÉ felhúzható fiók: itt nem lehet áttetsző,
           mert alatta a tábla szövege ütne át rajta. */
        background:#fff;
        border-radius:22px 22px 0 0;z-index:48;
        transform:translateY(125%);transition:transform .25s ease;
        box-shadow:0 -12px 34px rgba(20,60,40,.18)}
    .uj-felulet .beszelo.nyitva{transform:none}
    .uj-felulet .beszelo .chat-messages{max-height:none;flex:1;
        overflow-y:auto}

    /* AZ ALSÓ SÁV. */
    .mobil-sav{display:block;position:fixed;left:0;right:0;bottom:0;
        z-index:49;background:#fff;border-top:1px solid #e4eee8;
        padding:9px 12px 12px;box-shadow:0 -8px 24px rgba(20,60,40,.10)}
    /* A telefonos szabály függőlegesbe rakja a beíró sávot, és a Küldés
       gombot teljes szélességűre – attól lett a sáv 240 képpont magas.
       Itt egy sorban maradnak. */
    .mobil-sav .chat-input-bar{margin:0;padding:0;display:flex;gap:10px;
        border:0;flex-direction:row;align-items:stretch}
    .mobil-sav .chat-input-bar textarea{flex:1;font-size:15px;
        height:50px;min-height:50px;max-height:50px;padding:13px 14px}
    .mobil-sav .chat-send-btn{width:auto;padding:0 18px;font-size:15px;
        white-space:nowrap}
    .mobil-sav .voice-panel{display:flex;align-items:center;gap:14px;
        margin:0;padding:0;background:none;box-shadow:none;min-height:0}
    .mobil-sav .voice-status{margin:0;font-size:14.5px;text-align:left}
    .mobil-gombok{display:flex;gap:8px;margin-top:9px}
    .mobil-gomb{flex:1;text-align:center;background:#eef4f1;border:0;
        border-radius:12px;padding:10px 6px;font:700 13px/1.25 inherit;
        color:#23503a;cursor:pointer;text-decoration:none;display:block;
        -webkit-tap-highlight-color:transparent}
    .mobil-gomb.aktiv{background:#1f6f43;color:#fff}
    .mobil-gomb .pott{display:none;width:8px;height:8px;border-radius:50%;
        background:#f5a623;margin:3px auto 0}
    .mobil-gomb.uzenet .pott{display:block}

    /* A fejlécben lévő mód-váltó és a mikrofon ikon telefonon KÉTSZER
       lenne ott, mert az alsó sávban feliratos gombot kapott. */
    .chat-layout:has(.uj-felulet) .chat-header-topbar .chat-mode-toggle{
        display:none}
    /* A lecke neve EGY sor, koppintásra nyílik ki. A hosszú spanyol
       címek négy sort vittek el a fejlécből, és ez csak romlani fog. */
    .chat-layout:has(.uj-felulet) .chat-current-topic{
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        font-size:15px;line-height:1.3;cursor:pointer}
    .chat-layout:has(.uj-felulet) .chat-current-topic.cim-nyitva{
        white-space:normal;overflow:visible;text-overflow:clip}

    /* Ne maradjon nagy üres folt a lap alján: telefonon a felület
       annyi legyen, amennyi a tartalom. */
    .chat-layout:has(.uj-felulet){min-height:0}
  }


  /* ── 6–8 év: nagy elemek, meleg felület, kevés szó ── */
  .kor-kicsi .munkater{background:#fffdf6;border-color:#f0e2c2;border-radius:18px}
  .kor-kicsi .munkater-cim{font-size:20px;color:#6b5416}
  .kor-kicsi .munkater-utasitas{font-size:15px;color:#8a7440}
  .kor-kicsi .munkater .feladat{font-size:118%}

  /* ── 9–11 év: tárgyszerű, világos, a lépések látszanak ── */
  .kor-kozep .munkater{background:#fbfcfd;border-color:#dae4ee}
  .kor-kozep .munkater-cim{color:#22364b}

  /* ── 12–14 év: szerszám, nem játék. Sötét, sűrű, komoly. ── */
  .kor-nagy .munkater{background:#171c24;border-color:#2c3744;color:#dde5ee;
                      border-radius:10px}
  .kor-nagy .munkater-cim{color:#eef4fa;font-size:15.5px;font-weight:600}
  .kor-nagy .munkater-utasitas{color:#8296ab;font-size:12.5px}
  .kor-nagy .munkater .feladat{color:#dde5ee}
  .kor-nagy .munkater .feladat input,
  .kor-nagy .munkater .feladat .fsz-jegy{background:#141a21;border-color:#33404f;
                                          color:#eef4fa}
  /* ══ SZÖVEG-FELÜLET ══════════════════════════════════════════════════
     A gyerek a szavakra kattint. A jelölt szó ALÁHÚZVA marad – ugyanaz a
     gesztus, mint a füzetben, ezért nem kell magyarázni. */
  .feladat-szoveg{width:100%}
  .fsz-kerdes{margin:0 0 14px;font-size:14.5px;line-height:1.5;font-weight:600}
  /* ── INTERAKTÍV ELEMEK (pizza, béka, óra) ── */
  .ie-kerdes{font-size:17px;font-weight:700}
  .ie-tort{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;
      line-height:1;margin:0 3px;font-weight:800}
  .ie-tort span:first-child{border-bottom:2.5px solid currentColor;padding:0 3px 2px}
  .ie-tort span:last-child{padding-top:2px}
  .ie-allas{font-size:14px;font-weight:700;color:#5B6B63;margin:-4px 0 4px}
  .ie-svg{display:block;width:100%;height:auto;margin:6px auto 12px;overflow:visible;
      touch-action:none;user-select:none;-webkit-user-select:none}
  .ie-pizza,.ie-ora{max-width:300px}
  .ie-beka{max-width:620px}
  /* A munkatér flex-doboza a tartalom szélességére húzná össze: a béka kapja
     meg a teljes szélességet, a pizza és az óra egy kényelmes kártyát. */
  .munkater-test > .feladat-beka{flex:1 1 auto;width:100%;max-width:680px}
  .munkater-test > .feladat-pizza,.munkater-test > .feladat-ora{flex:0 1 380px;width:100%}
  .munkater-test > .feladat-racs,.munkater-test > .feladat-szogmero,
  .munkater-test > .feladat-koordinata,.munkater-test > .feladat-terulet{flex:0 1 420px;width:100%;position:relative}
  .ie-negyzetes{max-width:380px}
  .ie-szelet,.ie-szam{cursor:pointer}
  .ie-szam:hover circle{fill:#FFF4E0}
  .ie-uzenet{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:#FFF1E0;
      color:#8A4B00;font-weight:700;font-size:14.5px;line-height:1.4}
  /* ── 3. csomag: mérleg, százalék, tört, iránytű, idővonal, kotta, címkék, memória ── */
  .munkater-test > .feladat-merleg,.munkater-test > .feladat-szazalek,.munkater-test > .feladat-tort,
  .munkater-test > .feladat-irany,.munkater-test > .feladat-idovonal,.munkater-test > .feladat-kotta,
  .munkater-test > .feladat-cimke,.munkater-test > .feladat-memoria{flex:0 1 460px;width:100%;position:relative}
  .ie-vaszon{background:#fff;border-radius:14px}
  .kor-nagy .ie-vaszon{background:#e9eef4}
  .ie-gombsor{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
  .ie-masik{background:#eef4f1;border:0;border-radius:12px;padding:10px 16px;font:700 14px/1.2 inherit;
      color:#1F7A4D;cursor:pointer}
  .ie-kartyak{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;margin:6px 0 10px}
  .ie-kartya{background:#FFF4E0;border:2px solid #F5C77A;border-radius:12px;padding:8px 12px;font-weight:800;
      font-size:15px;color:#0E2A1E;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
      text-align:center;line-height:1.2}
  .ie-kartya.huzott{position:fixed;z-index:10000;box-shadow:0 10px 24px rgba(0,0,0,.2);cursor:grabbing}
  .ie-helyek{display:flex;gap:8px;padding-top:28px}
  .ie-hely{flex:1;min-height:70px;border:2.5px dashed #BFD6C8;border-radius:12px;display:flex;align-items:center;
      justify-content:center;padding:4px;background:#FAFDFB;position:relative;min-width:0}
  .ie-hely .ie-kartya{padding:6px 6px;font-size:13.5px;word-break:break-word}
  .ie-ev{position:absolute;top:-25px;left:0;right:0;text-align:center;color:#1F7A4D;font-size:14px;font-weight:900}
  .kor-nagy .ie-ev{color:#6fd0a2}
  .ie-hely.tele{border-style:solid;border-color:#3DDC97;background:#E7F6EE}
  .ie-hely.cel{background:#FFF4E0}
  .ie-tengely{height:6px;background:#1F7A4D;border-radius:3px;margin:8px 0 12px}
  .ie-cimke-kep{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto 12px;
      background:#fff;border-radius:14px}
  .ie-cimke-kep svg{position:absolute;inset:0;width:100%;height:100%}
  .ie-hely-kicsi{position:absolute;width:34%;min-height:40px;padding:2px}
  .ie-mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:4px auto 12px;
      perspective:700px}
  .ie-mk{aspect-ratio:1;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;
      border:0;padding:0;background:none;font:inherit;-webkit-tap-highlight-color:transparent}
  .ie-mk.fel,.ie-mk.kesz{transform:rotateY(180deg)}
  .ie-mk span{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:900;text-align:center;padding:4px;
      word-break:break-word;line-height:1.15}
  .ie-mk .h{background:#1F7A4D;color:#3DDC97;font-size:26px}
  .ie-mk .e{background:#FFF4E0;border:2px solid #F5C77A;color:#0E2A1E;transform:rotateY(180deg);font-size:14px}
  .ie-mk .e.emo{font-size:34px}
  .ie-mk.kesz .e{background:#E7F6EE;border-color:#3DDC97}
  .ie-zongora{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
  .ie-zongora button{flex:0 1 56px;height:104px;border-radius:0 0 12px 12px;background:#fff;border:2px solid #D7E0DA;
      box-shadow:0 5px 0 #C9D3CC;color:#0E2A1E;font:800 15px/1 inherit;padding:0 0 10px;display:flex;
      align-items:flex-end;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ie-zongora button.szol{background:#FFF4E0;transform:translateY(3px);box-shadow:0 2px 0 #C9D3CC}
  .ie-konfetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
  .feladat-pizza,.feladat-beka,.feladat-ora{position:relative}
  .ie-szuper{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);
      background:#1F7A4D;color:#fff;font-weight:900;font-size:30px;padding:12px 26px;
      border-radius:999px;box-shadow:0 10px 26px rgba(14,42,30,.3);pointer-events:none;
      animation:ie-szuper .5s cubic-bezier(.3,1.6,.5,1) both;z-index:5;white-space:nowrap}
  @keyframes ie-szuper{0%{transform:translate(-50%,-50%) scale(0)}100%{transform:translate(-50%,-50%) scale(1)}}
  @keyframes ie-rezeg{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .ie-rezeg{animation:ie-rezeg .45s ease}
  @keyframes ie-forog{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .ie-forog{animation:ie-forog .9s cubic-bezier(.3,1.4,.5,1)}
  @keyframes ie-pattan{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

  .fszoveg-mondat{font-size:20px;line-height:2;margin-bottom:18px}

  /* ══ ÉPÍTŐ-FELÜLET ═══════════════════════════════════════════════════
     Fent a mondat épül, lent a kártyakészlet. Koppintásra mozognak – nincs
     húzogatás, mert az telefonon és kis kézzel megbízhatatlan. */
  .feladat-epito{width:100%}
  .fepito-sor{min-height:56px;display:flex;flex-wrap:wrap;gap:8px;
              padding:10px;border:2px dashed #c6d5e2;border-radius:12px;
              margin-bottom:14px;align-content:flex-start}
  .fepito-sor[data-ures="1"]::before{content:"";flex:1}
  .fepito-keszlet{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .fepito-kartya{font:600 16px/1.2 inherit;color:#22364b;background:#fff;
                 border:1.5px solid #c6d5e2;border-radius:10px;
                 padding:10px 14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .fepito-kartya:hover{border-color:#3fa88f}
  .fepito-sor .fepito-kartya{background:#eaf6f2;border-color:#3fa88f}
  .feladat-kesz .fepito-kartya{cursor:default}

  .kor-kicsi .fepito-kartya{font-size:19px;padding:13px 17px}
  .kor-kicsi .fepito-sor{min-height:66px}
  .kor-nagy .fepito-kartya{background:#1d2530;border-color:#33404f;color:#dde5ee;

  .kor-nagy .fepito-sor{border-color:#33404f}
  .kor-nagy .fepito-sor .fepito-kartya{background:#24404a;border-color:#4a9f7e}
  /* ══ ÁBRA-FELÜLET ════════════════════════════════════════════════════
     Fent a rajz a számokkal, alatta a számozott sorok, legalul a
     névkártyák. Koppintásra mozognak, mint az építő-felületen. */
  .feladat-abra{width:100%}
  /* A rajz ne nyomja le a címkéket a képernyőről: kap egy magassági
     korlátot is, nem csak szélességit. */
  .fabra-rajz{max-width:260px;margin:0 auto 18px;background:#fff;
              border-radius:10px;padding:10px;text-align:center}
  .fabra-rajz svg{max-height:280px}
  .fabra-sorok{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .fabra-sor{display:flex;align-items:center;gap:10px}
  .fabra-jel{flex:0 0 30px;height:30px;border-radius:50%;background:#3fa88f;
             color:#fff;font:700 15px/30px inherit;text-align:center}
  .fabra-hely{flex:1;min-height:42px;border:2px dashed #c6d5e2;border-radius:10px;
              display:flex;align-items:center;padding:4px 6px}
  .fabra-keszlet{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .fabra-kartya{font:600 15px/1.2 inherit;color:#22364b;background:#fff;
                border:1.5px solid #c6d5e2;border-radius:10px;padding:9px 13px;
                cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .fabra-kartya:hover{border-color:#3fa88f}
  .fabra-hely .fabra-kartya{background:#eaf6f2;border-color:#3fa88f;box-shadow:none}
  .feladat-kesz .fabra-kartya{cursor:default}

  .kor-kicsi .fabra-kartya{font-size:18px;padding:12px 16px}
  .kor-kicsi .fabra-jel{flex:0 0 36px;height:36px;font-size:18px;line-height:36px}
  .kor-nagy .fabra-rajz{background:#e9eef4}
  .kor-nagy .fabra-kartya{background:#1d2530;border-color:#33404f;color:#dde5ee;
                          font-size:14px}
  .kor-nagy .fabra-hely{border-color:#33404f}
  .kor-nagy .fabra-hely .fabra-kartya{background:#24404a;border-color:#4a9f7e}
  .kor-nagy .fabra-jel{background:#4a9f7e}
  /* A kivonandó sor üres helyiértéke BEÍRHATÓ – 5600 − 800 esetén a 800
     elé eső hely a kölcsönkérés jegyzetének a helye. */
  .fsz-ures-mezo{border:2px dashed #cbd8e2;border-radius:8px;background:#fcfdfe;
                 text-align:center;font:inherit;color:#7a5c14;padding:0}
  .fsz-ures-mezo:focus{outline:none;border-color:#3fa88f;background:#f2fbf8}
  /* ══ MODELL-FELÜLET ══════════════════════════════════════════════════
     Csúszka + növekvő oszlop. A célvonal végig látszik, hogy a gyereknek
     legyen mihez igazodnia, és lássa, MERRE kell mozdulnia. */
  .feladat-modell{width:100%}
  .fmod-cel{font-size:14px;font-weight:700;color:#8a6a14;margin-bottom:10px}
  .fmod-sav{position:relative;height:30px;background:#eef3f8;border-radius:8px;
            overflow:hidden;margin-bottom:12px}
  .fmod-sav i{display:block;height:100%;width:0;border-radius:8px;
              background:linear-gradient(90deg,#7fc4b2,#3fa88f);
              transition:width .12s linear}
  .fmod-celvonal{position:absolute;top:0;bottom:0;width:3px;background:#e8a317;
                 border-radius:2px}
  .fmod-kijelzo{font:700 26px/1.2 inherit;color:#22364b;margin-bottom:14px;
                text-align:center}
  .fmod-talalt .fmod-kijelzo{color:#2f8f60}
  .fmod-talalt .fmod-sav i{background:linear-gradient(90deg,#6fd0a2,#2f8f60)}
  .fmod-csuszka{width:100%;margin:0 0 18px;accent-color:#3fa88f}

  .kor-kicsi .fmod-kijelzo{font-size:32px}
  .kor-kicsi .fmod-sav{height:38px}
  .kor-nagy .fmod-kijelzo{font-size:20px;color:#eef4fa;
                          font-family:"Consolas",monospace}
  .kor-nagy .fmod-sav{background:#232c37}
  .kor-nagy .fmod-cel{color:#d6b25e}
  .kor-nagy .fmod-talalt .fmod-kijelzo{color:#6fd0a2}
  /* írásbeli osztás – balról jobbra */
  .feladat-osztas{display:block;width:fit-content;max-width:100%;--oszt-cella:40px}
  .oszt-racs{display:grid;grid-auto-rows:46px;gap:2px 2px;align-items:center;justify-items:center;margin-bottom:8px}
  .oszt-c{width:100%;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
  .oszt-jegy{font-size:28px;color:#16241d}
  .oszt-jel{font-size:26px;color:#ef5f5f}
  .oszt-oszto{font-size:28px;color:#16241d;border-left:3px solid #16241d;border-bottom:3px solid #16241d;height:100%;display:flex;align-items:center;justify-content:flex-start;padding-left:10px;box-sizing:border-box}
  .oszt-mezo.fsz-mezo{width:100%;max-width:38px;height:44px;font-size:26px}
  .oszt-mezo.oszt-akt{border-color:#1e7a4d;box-shadow:0 0 0 3px rgba(30,122,77,.18)}
  .oszt-maradek{width:88%;max-width:34px;height:38px;box-sizing:border-box;border:2px dashed #cbd8e2;border-radius:8px;background:#fcfdfe;text-align:center;font:inherit;font-size:20px;font-weight:800;color:#5b6b63;padding:0}
  .oszt-maradek:focus{outline:none;border-color:#3fa88f;background:#f2fbf8}
  .oszt-lehoz{font-size:20px;color:#9aa8a0}
  .oszt-tipp{font-size:15px;font-weight:700;color:#1e7a4d;background:#eef7f2;border-radius:10px;padding:7px 10px;margin-bottom:6px}
  @media (max-width:420px){.feladat-osztas{--oszt-cella:32px}.oszt-mezo.fsz-mezo{height:40px;font-size:22px}.oszt-jegy,.oszt-oszto{font-size:24px}.oszt-maradek{height:34px;font-size:17px}}
  /* Az alsó szám jegyei átírhatók: kölcsönkérés után a 2-ből 3 lesz.
     Alapból ugyanúgy néznek ki, mint a nyomtatott számjegyek – csak akkor
     látszik, hogy mező, ha a gyerek beleáll. */
  .fsz-jegy-mezo{border:2px solid transparent;background:transparent;
                 text-align:center;padding:0;border-radius:8px;cursor:text;
                 /* A .fsz-jegy méretét és vastagságát MEG KELL TARTANI:
                    az input alapból vékonyabb betűt örököl, és az alsó sor
                    halványabbnak látszott, mint a felső. */
                 font-family:inherit;font-size:30px;font-weight:800;
                 color:#16241d;line-height:1.15;height:48px}
  .fsz-jegy-mezo:hover{border-color:#e3ebf2}
  .fsz-jegy-mezo:focus{outline:none;border-color:#3fa88f;background:#f2fbf8}
  /* A MOZGÓ KABALA MÉRETE.
     A rajztáblán a robot körül sok az üres hely: 380 képpontos helyen
     is csak 155 képpont volt maga a figura. Ezért a vásznat a doboznál
     NAGYOBBRA vesszük, és a dobozzal levágjuk a szélét – így ugyanabban
     a helyben a robot majdnem kétszer akkora. */
  .chat-kabala-doboz{position:sticky;bottom:14px;display:block;
                     width:100%;max-width:300px;aspect-ratio:1/1;
                     overflow:hidden}
  /* CSAK a rajztábla legszélét vágjuk le – ott van a „Click me!"
     felirat. 190% korábban a robot fejét is levágta, ezért nézett ki
     úgy, mintha dobozban ülne. */
  /* A képes kabala arcai: rövid áttűnés, örömre egy kis ugrás. A 400×600-as
     képeken a figura körül van egy kis hely, ezért valamivel szélesebb lehet. */
  .chat-kabala.kabala-allapotos{transition:opacity .14s ease}
  .chat-kabala.kabala-valt{opacity:0}
  .chat-kabala.kabala-ugrik{animation:kabala-ugras .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes kabala-ugras{0%{transform:translateY(0)}35%{transform:translateY(-22px)}
    60%{transform:translateY(0)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.chat-kabala.kabala-ugrik{animation:none}}
  .chat-kabala-rive{display:block;position:relative;
                    width:118%;height:118%;left:-9%;top:-9%}

  /* ══ KÉPES SZÓTÁR: a szó melletti kép (2026-10-07) ══ */

.dm{--bezs:#FBF5EA;--zold:#1F7A4D;--zold-s:#17603C;--menta:#3DDC97;--narancs:#F5A01E;--narancs-a:#D27E0B;

.dm .csoportok .kartya.kepes{min-width:0;padding:2px 4px}

.dm .dm-kesz-sor{margin-top:12px}

.dm .betuhalo div.mutat{background:#FDE8F1;color:#B03D74}

.dm .szamgombok.fgep-be button{min-width:36px;padding:10px 6px;font-size:18px}
.dm .fgep-x{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.12em}
