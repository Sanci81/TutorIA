<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.b{animation:ug 1.6s cubic-bezier(.45,0,.55,1) infinite;transform-origin:100px 132px}
.a{animation:ar 1.6s cubic-bezier(.45,0,.55,1) infinite;transform-origin:100px 140px}
.v{animation:vo 1.6s ease-in-out infinite}
@keyframes ug{0%,100%{transform:translateY(0) scale(1.08,.9)}12%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-34px) scale(.96,1.05)}78%{transform:translateY(0) scale(1,1)}88%{transform:translateY(0) scale(1.08,.9)}}
@keyframes ar{0%,100%{transform:scale(1);opacity:.55}45%{transform:scale(.6);opacity:.25}78%{transform:scale(1);opacity:.55}}
@keyframes vo{0%,20%,70%,100%{opacity:0}40%,55%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.b,.a,.v{animation:none}.b{transform:translateY(-20px)}.v{opacity:.9}}
</style>
<ellipse class="a" cx="100" cy="140" rx="44" ry="7" fill="#BFE3CF"/>
