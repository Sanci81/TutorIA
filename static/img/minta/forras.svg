<style>
.bu{animation:bu 1.8s ease-in infinite}
.g{animation:go 3s ease-in-out infinite}
.l{animation:la .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bu{0%{transform:translateY(0);opacity:0}15%{opacity:.95}85%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@keyframes go{0%{transform:translateY(8px);opacity:0}40%{opacity:.9}100%{transform:translateY(-12px);opacity:0}}
@keyframes la{from{transform:scaleY(.86)}to{transform:scaleY(1.08)}}
@media (prefers-reduced-motion:reduce){.bu,.g,.l{animation:none}}
</style>
