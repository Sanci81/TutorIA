<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    ISKOLAI JELEK A HÁTTÉRBE.
    Egyetlen, kézzel elrendezett kép – NEM ismétlődő csempe –, ezért
    egyetlen jel sem vágódik ketté a szakasz szélén.
    A jelek szándékosan a KÉT SZÉLEN és az ALSÓ SÁVBAN ülnek: középen
    (x ≈ 300–1300) szabad marad a hely a címnek és a kártyának.
    Minden jel valamelyik tantárgyra utal.
  -->
  <g font-family="Nunito, Segoe UI, Arial, sans-serif" font-weight="800">

    <!-- ══ BAL SZÉL ══ -->
    <text x="40" y="132" font-size="52" fill="#2f8fd8" fill-opacity=".16">7+5</text>
    <text x="34" y="250" font-size="40" fill="#f5a623" fill-opacity=".17">12:4</text>
    <text x="40" y="372" font-size="46" fill="#ef5f5f" fill-opacity=".15">ABC</text>
    <!-- hangjegy -->
    <g stroke="#e0609b" stroke-opacity=".17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 500v-56l42-9v56"/>
      <circle cx="49" cy="504" r="11"/>
      <circle cx="91" cy="495" r="11"/>
    </g>
    <!-- falevél -->
    <g stroke="#17b8a6" stroke-opacity=".17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M38 640c0-44 31-71 69-71 0 44-29 71-69 71Z"/>
      <path d="M38 640c11-18 29-33 48-42"/>
    </g>

    <!-- ══ JOBB SZÉL ══ -->
    <!-- lombik -->
    <g stroke="#2f8f60" stroke-opacity=".17" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1502 66v26l-24 42a9 9 0 0 0 8 13h48a9 9 0 0 0 8-13l-24-42V66"/>
      <path d="M1496 66h34M1486 134h58"/>
    </g>
    <!-- földgömb -->
    <g stroke="#f5a623" stroke-opacity=".18" stroke-width="5">
      <circle cx="1522" cy="236" r="30"/>
      <path d="M1492 236h60M1522 206c13 15 13 45 0 60M1522 206c-13 15-13 45 0 60"/>
    </g>
    <text x="1470" y="380" font-size="40" fill="#9a5e0c" fill-opacity=".16">H₂O</text>
    <!-- könyv -->
    <g stroke="#2f8fd8" stroke-opacity=".16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1468 560V444a12 12 0 0 1 12-12h72v140h-72a12 12 0 0 1-12-12Z"/>
      <path d="M1502 432v140"/>
    </g>
    <!-- vonalzó -->
    <g stroke="#0e8a7c" stroke-opacity=".16" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1480 634h84v38h-84z"/>
      <path d="M1500 634v13M1522 634v19M1544 634v13"/>
    </g>

    <!-- ══ ALSÓ SÁV, a bal oldali üres részen ══ -->
    <g stroke-width="5" stroke-linecap="round">
      <path d="M232 664h34M249 647v34" stroke="#2f8fd8" stroke-opacity=".13"/>
      <path d="M344 664h34" stroke="#ef5f5f" stroke-opacity=".13"/>
      <path d="M448 650l24 28M472 650l-24 28" stroke="#7b5bd6" stroke-opacity=".13"/>
      <path d="M552 656h34M552 672h34" stroke="#0e8a7c" stroke-opacity=".13"/>
    </g>
    <!-- ecset -->
    <g stroke="#c9782a" stroke-opacity=".15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M188 616l62-62M240 542l18 18"/>
      <path d="M178 628l5-19 14 14z"/>
    </g>
  </g>
</svg>
