<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    ISKOLAI JELEK A HÁTTÉRBE.
    Egyetlen, kézzel elrendezett kép – NEM ismétlődő csempe –, ezért
    egyetlen jel sem vágódik ketté a szakasz szélén.
    A jelek SZÓRTAN, egyenként MÁS SZÖGBEN és MÁS MÉRETBEN állnak: nem sorban,
    nem egyforma távolságra. Ugyanakkor mind a KÉT SZÉLEN maradnak, középen
    (x ≈ 300–1290) szabad a hely a szövegnek és a kártyának.
  -->
  <g font-family="Nunito, Segoe UI, Arial, sans-serif" font-weight="800">

    <!-- ══ BAL OLDAL ══ -->
    <g transform="rotate(-13 96 118)">
      <text x="34" y="132" font-size="56" fill="#2f8fd8" fill-opacity=".16">7+5</text>
    </g>
    <g transform="rotate(9 118 252)">
      <text x="62" y="266" font-size="34" fill="#f5a623" fill-opacity=".18">12:4</text>
    </g>
    <g transform="rotate(-6 84 378)">
      <text x="20" y="392" font-size="48" fill="#ef5f5f" fill-opacity=".15">ABC</text>
    </g>
    <!-- hangjegy, megdöntve -->
    <g transform="rotate(14 96 486)" stroke="#e0609b" stroke-opacity=".17" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 500v-56l42-9v56"/>
      <circle cx="65" cy="504" r="11"/>
      <circle cx="107" cy="495" r="11"/>
    </g>
    <!-- falevél -->
    <g transform="rotate(-21 74 606)" stroke="#17b8a6" stroke-opacity=".18" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 640c0-44 31-71 69-71 0 44-29 71-69 71Z"/>
      <path d="M40 640c11-18 29-33 48-42"/>
    </g>
    <!-- ecset, ferdén, feljebb -->
    <g transform="rotate(22 224 520)" stroke="#c9782a" stroke-opacity=".15" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M196 548l58-58M244 478l18 18"/>
      <path d="M186 560l5-19 14 14z"/>
    </g>
    <!-- két szórt műveleti jel a bal alsó részen -->
    <g stroke-width="5" stroke-linecap="round">
      <g transform="rotate(18 258 668)">
        <path d="M241 668h34M258 651v34" stroke="#2f8fd8" stroke-opacity=".13"/>
      </g>
      <g transform="rotate(-11 384 640)">
        <path d="M367 640h34" stroke="#ef5f5f" stroke-opacity=".14"/>
      </g>
      <g transform="rotate(7 480 682)">
        <path d="M468 668l24 28M492 668l-24 28" stroke="#7b5bd6" stroke-opacity=".12"/>
      </g>
    </g>

    <!-- ══ JOBB OLDAL ══ -->
    <!-- lombik -->
    <g transform="rotate(11 1518 100)" stroke="#2f8f60" stroke-opacity=".17" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M1502 52v26l-24 42a9 9 0 0 0 8 13h48a9 9 0 0 0 8-13l-24-42V52"/>
      <path d="M1496 52h34M1486 120h58"/>
    </g>
    <!-- földgömb, kicsit lejjebb és balrább -->
    <g transform="rotate(-16 1462 214)" stroke="#f5a623" stroke-opacity=".18" stroke-width="5">
      <circle cx="1462" cy="214" r="27"/>
      <path d="M1435 214h54M1462 187c12 14 12 41 0 54M1462 187c-12 14-12 41 0 54"/>
    </g>
    <g transform="rotate(8 1522 366)">
      <text x="1470" y="380" font-size="38" fill="#9a5e0c" fill-opacity=".16">H₂O</text>
    </g>
    <!-- könyv -->
    <g transform="rotate(-9 1512 500)" stroke="#2f8fd8" stroke-opacity=".16" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M1468 560V444a12 12 0 0 1 12-12h72v140h-72a12 12 0 0 1-12-12Z"/>
      <path d="M1502 432v140"/>
    </g>
    <!-- vonalzó, erősen megdöntve -->
    <g transform="rotate(-24 1400 630)" stroke="#0e8a7c" stroke-opacity=".16" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M1358 612h84v38h-84z"/>
      <path d="M1378 612v13M1400 612v19M1422 612v13"/>
    </g>
    <!-- egy egyenlőségjel szórtan -->
    <g transform="rotate(15 1546 596)">
      <path d="M1529 588h34M1529 604h34" stroke="#0e8a7c" stroke-opacity=".13" stroke-width="5"
            stroke-linecap="round"/>
    </g>
  </g>
</svg>
